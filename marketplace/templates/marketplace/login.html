{% extends 'marketplace/base.html' %}

{% block title %}Login - AdEzy{% endblock %}

{% block content %}
<div class="container">
    <div style="max-width: 500px; margin: 60px auto;">
        <div class="glass-panel">
            <h2 style="text-align: center; margin-bottom: 30px;">Login to AdEzy</h2>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert-box {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #f1f5f9;">
                        Username or Email
                    </label>
                    <input 
                        type="text" 
                        name="username" 
                        class="search-input" 
                        placeholder="Enter your username or email"
                        required
                        style="width: 100%;"
                    >
                </div>
                
                <div style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #f1f5f9;">
                        Password
                    </label>
                    <div style="position: relative;">
                        <input 
                            type="password" 
                            name="password" 
                            id="login-password"
                            class="search-input" 
                            placeholder="Enter your password"
                            required
                            style="width: 100%; padding-right: 45px;"
                        >
                        <button 
                            type="button" 
                            onclick="togglePassword('login-password', this)"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 5px; color: #64748b; font-size: 1.1rem;"
                            aria-label="Toggle password visibility"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px;">
                    Login
                </button>
            </form>
            
            <p style="text-align: center; margin-top: 20px; color: #64748b;">
                Don't have an account? 
                <a href="{% url 'register' %}" style="color: var(--gold); font-weight: 600; text-decoration: none;">
                    Register here
                </a>
            </p>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        button.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
    } else {
        input.type = 'password';
        button.innerHTML = '<i class="fa-solid fa-eye"></i>';
    }
}
</script>
{% endblock %}
